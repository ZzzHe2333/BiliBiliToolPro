# Tencent SCF sample for ZzzHe2333/BiliBiliToolPro
component: scf
name: bilibili_tool

inputs:
  name: ${name}_scf
  namespace: default
  enableRoleAuth: false
  src: ./bin/publish/
  handler: index.main_handler
  runtime: CustomRuntime
  region: ap-guangzhou
  description: BiliBiliToolPro scheduled tasks
  memorySize: 128
  initTimeout: 30
  timeout: 86400
  asyncRunEnable: true
  traceEnable: true
  events:
    - timer:
        parameters:
          name: DailyTask
          cronExpression: "0 30 12 * * * *"
          enable: false
          argument: Daily
    - timer:
        parameters:
          name: VipBigPointTask
          cronExpression: "0 07 01 * * * *"
          enable: false
          argument: VipBigPoint
  environment:
    variables: {}
    # 配置示例（不要把真实 Cookie 提交到仓库）：
    # variables:
    #   Zzz_BiliBiliCookies__1: "<COOKIE>"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bilibili_tool.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bilibili_tool.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bilibili_tool.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bilibili_tool.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- if or .Values.persistence.logs.enabled .Values.persistence.config.enabled }}
          volumeMounts:
            {{- if .Values.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/Logs
            {{- end }}
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /app/config
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.persistence.logs.enabled .Values.persistence.config.enabled }}
      volumes:
        {{- if .Values.persistence.logs.enabled }}
        - name: logs
          hostPath:
            path: {{ required "persistence.logs.hostPath is required when logs persistence is enabled" .Values.persistence.logs.hostPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.persistence.config.enabled }}
        - name: config
          hostPath:
            path: {{ required "persistence.config.hostPath is required when config persistence is enabled" .Values.persistence.config.hostPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

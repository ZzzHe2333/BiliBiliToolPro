# Default values for bilibili-tool.

namespace: default
replicaCount: 1

configmap:
  name: entry

image:
  repository: ghcr.io/zzzhe2333/bili_tool_web
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Web 容器使用无前缀配置键。
env:
  - name: BiliBiliCookies__1
    value: ""
  - name: DailyTaskConfig__Cron
    value: "0 0 15 * * ?"

volumes:
  log:
    enabled: true
    path: "/tmp/logs"
    name: "bili-tool-vol"
  login:
    enabled: true
    name: "entry"

podAnnotations: {}

resources:
  limits:
    cpu: 100m
    memory: 120Mi
  requests:
    cpu: 100m
    memory: 120Mi

nodeSelector: {}
tolerations: []
affinity: {}

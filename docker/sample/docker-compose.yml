services:
  bili_tool_web:
    image: ${BILI_TOOL_IMAGE:-ghcr.io/zzzhe2333/bili_tool_web:latest}
    container_name: bili_tool_web
    restart: unless-stopped
    tty: true
    volumes:
      - ./Logs:/app/Logs
      - ./config:/app/config
    ports:
      - "22330:8080"
    environment:
      TZ: "Asia/Shanghai"
      DailyTaskConfig__Cron: "0 0 15 * * ?"

name: Harden Qinglong locator once

on:
  push:
    branches:
      - fix/post-detach-hardening
    paths:
      - '.github/workflows/harden-qinglong-locator-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: fix/post-detach-hardening
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Make repository selection deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          task_dir = root / 'qinglong/SubscriptionTasks'
          old = '''BILI_REPO_DIR="$(find "$BILI_REPO_ROOT" -type d \\( -iname 'ZzzHe2333_BiliBiliToolPro' -o -iname 'ZzzHe2333_BiliBiliToolPro_main' \\) | head -1)"
          [ -n "$BILI_REPO_DIR" ] || { echo '[Zzz-Bili] 未找到仓库目录' >&2; exit 1; }'''
          new = '''BILI_REPO_DIR=""
          for candidate in \\
              "$BILI_REPO_ROOT/ZzzHe2333_BiliBiliToolPro" \\
              "$BILI_REPO_ROOT/ZzzHe2333_BiliBiliToolPro_main"; do
              if [ -d "$candidate" ]; then
                  BILI_REPO_DIR="$candidate"
                  break
              fi
          done
          if [ -z "$BILI_REPO_DIR" ]; then
              BILI_REPO_DIR="$(find "$BILI_REPO_ROOT" -type d \\( -iname 'ZzzHe2333_BiliBiliToolPro' -o -iname 'ZzzHe2333_BiliBiliToolPro_main' \\) | head -1)"
          fi
          [ -n "$BILI_REPO_DIR" ] || { echo '[Zzz-Bili] 未找到仓库目录' >&2; exit 1; }'''

          changed = 0
          for path in sorted(task_dir.glob('zzz_bili_task_*.sh')):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected locator block not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed += 1
          print(f'Updated {changed} Qinglong task entrypoints')

          base = task_dir / 'zzz_bili_task_base.inc'
          text = base.read_text(encoding='utf-8')
          old = '''fork_repo_name="ZzzHe2333_BiliBiliToolPro"
          fork_repo_dir="$(find "$dir_repo" -type d \\( -iname "$fork_repo_name" -o -iname "${fork_repo_name}_main" \\) | head -1)"'''
          new = '''fork_repo_name="ZzzHe2333_BiliBiliToolPro"
          fork_repo_dir="${BILI_REPO_DIR:-}"
          if [ -z "$fork_repo_dir" ] || [ ! -d "$fork_repo_dir" ]; then
              if [ -d "$dir_repo/$fork_repo_name" ]; then
                  fork_repo_dir="$dir_repo/$fork_repo_name"
              elif [ -d "$dir_repo/${fork_repo_name}_main" ]; then
                  fork_repo_dir="$dir_repo/${fork_repo_name}_main"
              else
                  fork_repo_dir="$(find "$dir_repo" -type d \\( -iname "$fork_repo_name" -o -iname "${fork_repo_name}_main" \\) | head -1)"
              fi
          fi'''
          if old not in text:
              raise SystemExit('Expected fork_repo_dir block not found in zzz_bili_task_base.inc')
          base.write_text(text.replace(old, new, 1), encoding='utf-8')

          common = root / 'qinglong/DefaultTasks/bili_task_base.inc'
          text = common.read_text(encoding='utf-8')
          old = '''qinglong_bili_repo="$(echo "$bili_repo" | sed 's/\\//_/g')${bili_branch}"
          qinglong_bili_repo_dir="$(find $dir_repo -type d \\( -iname $qinglong_bili_repo -o -iname ${qinglong_bili_repo}_main \\) | head -1)"'''
          new = '''qinglong_bili_repo="$(echo "$bili_repo" | sed 's/\\//_/g')${bili_branch}"
          qinglong_bili_repo_dir="${BILI_REPO_DIR:-}"
          if [ -z "$qinglong_bili_repo_dir" ] || [ ! -d "$qinglong_bili_repo_dir" ]; then
              if [ -d "$dir_repo/$qinglong_bili_repo" ]; then
                  qinglong_bili_repo_dir="$dir_repo/$qinglong_bili_repo"
              elif [ -d "$dir_repo/${qinglong_bili_repo}_main" ]; then
                  qinglong_bili_repo_dir="$dir_repo/${qinglong_bili_repo}_main"
              else
                  qinglong_bili_repo_dir="$(find "$dir_repo" -type d \\( -iname "$qinglong_bili_repo" -o -iname "${qinglong_bili_repo}_main" \\) | head -1)"
              fi
          fi'''
          if old not in text:
              raise SystemExit('Expected qinglong_bili_repo_dir block not found in DefaultTasks base')
          common.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Syntax check and commit
        shell: bash
        run: |
          set -euo pipefail
          for file in qinglong/SubscriptionTasks/*.sh qinglong/SubscriptionTasks/*.inc qinglong/DefaultTasks/*.inc; do
            bash -n "$file"
          done
          git diff --check
          rm -f .github/workflows/harden-qinglong-locator-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make Qinglong repository selection deterministic'
          git push origin HEAD:fix/post-detach-hardening

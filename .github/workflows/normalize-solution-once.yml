name: Normalize solution once

on:
  push:
    branches:
      - fix/post-detach-hardening
    paths:
      - '.github/workflows/normalize-solution-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: fix/post-detach-hardening
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Normalize stale solution items and retired defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          sln = root / 'Ray.BiliBiliTool.sln'
          text = sln.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          kept = []
          removed = []

          for line in lines:
              stripped = line.strip()
              # Solution Items entries use "path = path". Remove entries whose file no longer exists.
              if line.startswith('\t\t') and ' = ' in stripped:
                  left, right = stripped.split(' = ', 1)
                  if left == right and ('\\' in left or '/' in left or '.' in Path(left).name):
                      candidate = root / left.replace('\\', '/')
                      if not candidate.exists():
                          removed.append(left)
                          continue
              kept.append(line)

          with sln.open('w', encoding='utf-8-sig', newline='\n') as f:
              f.write('\n'.join(kept) + '\n')

          if removed:
              print('Removed stale Solution Items:')
              for item in removed:
                  print(f'  - {item}')

          retired = ('Silver2CoinTaskConfig', 'LiveLotteryTaskConfig', 'UnfollowBatchedTaskConfig')
          for relative in (
              'src/Ray.BiliBiliTool.Console/appsettings.json',
              'src/Ray.BiliBiliTool.Web/appsettings.json',
          ):
              path = root / relative
              content = path.read_text(encoding='utf-8-sig')
              for section in retired:
                  pattern = re.compile(
                      rf'("{re.escape(section)}"\s*:\s*\{{.*?"IsEnable"\s*:\s*)true',
                      re.S,
                  )
                  content, count = pattern.subn(r'\1false', content, count=1)
                  if count != 1:
                      raise SystemExit(f'Unable to set {section}.IsEnable=false in {relative}')
              path.write_text(content, encoding='utf-8')
          PY

      - name: Verify and commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/workflows/normalize-solution-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: normalize solution and retired task defaults'
          git push origin HEAD:fix/post-detach-hardening

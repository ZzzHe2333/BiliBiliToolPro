name: Publish image

on:
  workflow_dispatch:
    inputs:
      autoWithLatestTag:
        description: 'Auto Add Latest Tag'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'common.props'
      - '.github/workflows/publish-image.yml'
  release:
    types: [created]

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  GHCR_USERNAME: ${{ github.repository_owner }}
  GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  GHCR_IMG_NAME: "ghcr.io/zzzhe2333/bili_tool_web"

jobs:
  PublishImage:
    # fork-main 是青龙 bilitool 的滚动二进制预发布，不应触发 Web 容器镜像发布。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.release.tag_name != 'fork-main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GetTargetVersion
        id: getTargetVersion
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            target_version="${{ github.event.release.tag_name }}"
          else
            target_version="$(grep -oP '(?<=<Version>).*?(?=<\/Version>)' ./common.props)"
          fi
          echo "TargetVersion: $target_version"
          echo "TargetVersion=$target_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Generate tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          target_version="${{ steps.getTargetVersion.outputs.TargetVersion }}"
          tags_file="$(mktemp)"
          trap 'rm -f "$tags_file"' EXIT

          echo "${GHCR_IMG_NAME}:${target_version}" >> "$tags_file"

          dockerhub_enabled=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            dockerhub_enabled=true
            echo "${DOCKERHUB_USERNAME}/bili_tool_web:${target_version}" >> "$tags_file"
          fi

          publish_latest=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.autoWithLatestTag }}" = "true" ]; then
            publish_latest=true
          fi

          if [ "$publish_latest" = true ]; then
            echo "${GHCR_IMG_NAME}:latest" >> "$tags_file"
            if [ "$dockerhub_enabled" = true ]; then
              echo "${DOCKERHUB_USERNAME}/bili_tool_web:latest" >> "$tags_file"
            fi
          fi

          echo "将发布以下镜像标签："
          cat "$tags_file"
          {
            echo 'tags<<EOF'
            cat "$tags_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

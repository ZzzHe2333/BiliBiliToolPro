name: Publish image

on:
  workflow_call:
    inputs:
      imageTag:
        description: 'Container image tag to publish'
        required: true
        type: string
      publishLatest:
        description: 'Also update latest'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Optional image tag; blank uses manual-<commit>'
        required: false
        default: ''
        type: string
      publishLatest:
        description: 'Also update latest'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'common.props'
      - '.github/workflows/publish-image.yml'

permissions:
  contents: read
  packages: write

# 同一入口的旧镜像构建如果晚于新构建完成，会把 latest 回滚。
# reusable Release 调用的 github.workflow 是调用方名称，因此不会与普通 main push 互相取消。
concurrency:
  group: publish-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_USERNAME: ${{ github.repository_owner }}
  GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  GHCR_IMG_NAME: "ghcr.io/zzzhe2333/bili_tool_web"

jobs:
  PublishImage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          event_name="${{ github.event_name }}"
          requested_tag="${{ inputs.imageTag }}"
          publish_latest="false"

          # Reusable workflow calls always provide imageTag. Check it first because
          # github.event_name remains the caller's event in a called workflow.
          if [ -n "$requested_tag" ]; then
            image_tag="$requested_tag"
            publish_latest="${{ inputs.publishLatest }}"
          elif [ "$event_name" = "push" ]; then
            # Ordinary main commits are rolling container builds, not semantic releases.
            image_tag="main-${GITHUB_SHA::12}"
            publish_latest="true"
          elif [ "$event_name" = "workflow_dispatch" ]; then
            image_tag="manual-${GITHUB_SHA::12}"
            publish_latest="${{ inputs.publishLatest }}"
          else
            echo "Unsupported event without an explicit imageTag: $event_name" >&2
            exit 1
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container tag: $image_tag" >&2
            exit 1
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"
          echo "Image tag: $image_tag"
          echo "Publish latest: $publish_latest"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Generate tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${{ steps.image.outputs.image_tag }}"
          tags_file="$(mktemp)"
          trap 'rm -f "$tags_file"' EXIT

          echo "${GHCR_IMG_NAME}:${image_tag}" >> "$tags_file"
          if [ "${{ steps.image.outputs.publish_latest }}" = "true" ]; then
            echo "${GHCR_IMG_NAME}:latest" >> "$tags_file"
          fi

          echo "将发布以下 GHCR 镜像标签："
          cat "$tags_file"
          {
            echo 'tags<<EOF'
            cat "$tags_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

# https://github.com/June1991/serverless-express

name: auto-deploy-tencent-scf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1,3,5" # 每周一、三、五北京时间10点

env:
  IsAutoDeployTencentScf: ${{ secrets.IS_AUTO_DEPLOY_TENCENT_SCF }} # 是否开启自动部署云函数

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${IsAutoDeployTencentScf:-}" == "true" ]]; then
            echo "result=开启" >> "$GITHUB_OUTPUT"
          else
            echo "result=关闭" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy serverless
    runs-on: ubuntu-latest
    needs: pre-check
    if: needs.pre-check.outputs.result == '开启'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify main provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Tencent SCF deployment may only run from current main: selected=$GITHUB_SHA, main=$main_sha" >&2
            exit 1
          fi

      - name: Use Node.js 20 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Validate Tencent credentials
        shell: bash
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TENCENT_SECRET_ID:-}" || -z "${TENCENT_SECRET_KEY:-}" ]]; then
            echo "缺少 TENCENT_SECRET_ID 或 TENCENT_SECRET_KEY，停止部署。" >&2
            exit 1
          fi

      - name: Install Serverless Cloud Framework
        shell: bash
        run: |
          set -euo pipefail
          # 中国大陆优先使用 npmmirror；镜像异常时回退 npm 官方源。
          npm i -g serverless-cloud-framework --registry=https://registry.npmmirror.com \
            || npm i -g serverless-cloud-framework --registry=https://registry.npmjs.org
          scf -v

      - name: Deploy serverless
        shell: bash
        env:
          STAGE: dev
          SERVERLESS_PLATFORM_VENDOR: tencent
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          Tencent_Serverless_Yml: ${{ secrets.TENCENT_SERVERLESS_YML }}
        run: |
          set -euo pipefail
          cd ./tencentScf

          if [[ -n "${Tencent_Serverless_Yml:-}" ]]; then
            # 不打印 secret 内容，避免 serverless.yml 中的敏感配置进入 Actions 日志。
            printf '%s\n' "$Tencent_Serverless_Yml" > serverless.yml
            chmod 600 serverless.yml
            echo "已使用 TENCENT_SERVERLESS_YML 配置云函数。"
          else
            echo "未配置 TENCENT_SERVERLESS_YML，使用仓库默认 serverless.yml。"
          fi

          echo "开始发布项目"
          chmod +x publish.sh
          ./publish.sh

          echo "开始部署到腾讯云函数"
          scf deploy

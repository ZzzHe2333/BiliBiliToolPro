name: Publish release

on:
  workflow_dispatch:
  push:
    branches:
      - release-trigger

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: formal-release
  cancel-in-progress: false

jobs:
  build:
    name: Publish Release
    if: ${{ github.repository == 'ZzzHe2333/BiliBiliToolPro' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify main provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Formal releases may only be created from current main: selected=$GITHUB_SHA, main=$main_sha" >&2
            exit 1
          fi

      - name: Wait for required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/verify_required_checks.sh "$GITHUB_SHA"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep -oP '(?<=<Version>).*?(?=<\/Version>)' ./common.props)"
          changelog_version="$(sed -n 's/^## //p' CHANGELOG.md | head -1)"

          if [ -z "$version" ]; then
            echo "common.props 中未找到 Version" >&2
            exit 1
          fi

          if [ "$version" != "$changelog_version" ]; then
            echo "版本不一致：common.props=$version, CHANGELOG.md=$changelog_version" >&2
            exit 1
          fi

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$version"; then
            existing_sha="$(git rev-list -n 1 "$version")"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "版本标签 $version 已指向 $existing_sha，而当前提交为 $GITHUB_SHA。请先提升 common.props 版本号，禁止复用旧版本标签。" >&2
              exit 1
            fi
            echo "版本标签 $version 已存在且指向当前提交，将按幂等方式更新 Release。"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated release version: $version"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish and Zip Release
        shell: bash
        run: |
          set -euo pipefail
          cd ./scripts
          chmod +x ./publish.sh
          ./publish.sh --runtime all

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          files: './src/Ray.BiliBiliTool.Console/bin/Publish/*.zip'
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "BiliBiliToolPro-V${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: './src/Ray.BiliBiliTool.Console/bin/Publish/release_notes.md'
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true

  publish-image:
    name: Publish release container image
    needs: build
    uses: ./.github/workflows/publish-image.yml
    with:
      imageTag: ${{ needs.build.outputs.version }}
      # latest 始终跟随 main 的滚动镜像；正式 Release 只固化语义版本 tag，避免并发时把 latest 回滚。
      publishLatest: false
    secrets: inherit

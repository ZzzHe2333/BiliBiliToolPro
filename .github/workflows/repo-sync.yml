# 检查并同步上游仓库，但不会直接覆盖本 fork 的 main。
# 上游变化会合并到 sync/upstream-main，并创建/更新一个可人工审查的 PR。

name: upstream-sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1,3,5'
    # UTC 01:00 = 北京时间 09:00，每周一、三、五。

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.repository == 'ZzzHe2333/BiliBiliToolPro' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT || github.token }}

      - name: Fetch and merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          upstream_repo="https://github.com/RayWangQvQ/BiliBiliToolPro.git"
          sync_branch="sync/upstream-main"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$upstream_repo"
          git fetch upstream main --no-tags
          git fetch origin main --no-tags

          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          git checkout -B "$sync_branch" origin/main

          if ! git merge --no-ff --no-edit upstream/main; then
            echo "::error::上游 main 与当前 fork main 存在合并冲突。main 未被修改，请人工处理。"
            echo "### 上游同步失败" >> "$GITHUB_STEP_SUMMARY"
            echo "- 上游 commit: $upstream_sha" >> "$GITHUB_STEP_SUMMARY"
            echo "- 原因: 与 fork 定制代码存在 Git merge 冲突" >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

          if git diff --quiet origin/main HEAD --; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### 上游无需要同步的文件变化" >> "$GITHUB_STEP_SUMMARY"
            echo "- 上游 commit: $upstream_sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git push --force origin "$sync_branch"

          echo "### 已生成上游同步候选分支" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支: $sync_branch" >> "$GITHUB_STEP_SUMMARY"
          echo "- 上游 commit: $upstream_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update upstream sync PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail

          sync_branch="sync/upstream-main"
          title="chore: review upstream main updates"
          body=$(cat <<EOF
          自动检测到原项目 RayWangQvQ/BiliBiliToolPro 的 main 有新变化。

          上游 commit：$UPSTREAM_SHA

          此 PR 不会自动合并。请人工检查是否会影响本 fork 的：

          - Zzz_* 青龙隔离配置
          - B 币券临期保护
          - 青龙系统通知与敏感信息脱敏
          - 中国大陆安装/镜像逻辑
          - fork rolling binary 工作流
          - 本 fork 的默认配置和仓库链接

          如发现上游改动会覆盖 fork 定制，应在本 PR 中手工解决后再合并。
          EOF
          )

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$sync_branch" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
            echo "已更新现有上游同步 PR #$existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$sync_branch" \
              --title "$title" \
              --body "$body"
          fi

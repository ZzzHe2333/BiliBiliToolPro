name: Replace upstream repository references

on:
  push:
    branches:
      - chore/replace-upstream-repo-links

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository references
        shell: bash
        run: |
          set -euo pipefail
          old='RayWangQvQ/BiliBiliToolPro'
          new='ZzzHe2333/BiliBiliToolPro'

          mapfile -t files < <(grep -RIl --exclude-dir=.git "$old" . || true)
          printf 'Replacing references in %d files\n' "${#files[@]}"

          for file in "${files[@]}"; do
            sed -i "s#${old}#${new}#g" "$file"
          done

          # One-shot workflow: remove itself from the resulting commit.
          rm -f .github/workflows/replace-upstream-repo-links.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo 'No replacements were needed.'
            exit 0
          fi

          git commit -m 'chore: point repository references to ZzzHe2333 fork'
          git push origin "HEAD:${GITHUB_REF_NAME}"

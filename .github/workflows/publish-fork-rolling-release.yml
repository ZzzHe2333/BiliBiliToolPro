name: Publish fork rolling release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # bilitool 模式会把 fork-main-commit.txt 与当前仓库 HEAD 做严格校验。
    # 因此 main 的任何提交（包括仅文档/青龙脚本变化）都必须更新滚动构建，
    # 否则会出现“源码已更新但二进制被误判为过期”的情况。

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-rolling-release
  cancel-in-progress: true

jobs:
  build:
    name: Build fork rolling binaries
    if: ${{ github.repository == 'ZzzHe2333/BiliBiliToolPro' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT || github.token }}
          fetch-depth: 0

      - name: Verify main provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "fork-main may only be published from current main: selected=$GITHUB_SHA, main=$main_sha" >&2
            exit 1
          fi

      - name: Wait for required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/verify_required_checks.sh "$GITHUB_SHA"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained binaries
        run: |
          cd ./scripts
          chmod +x ./publish.sh
          ./publish.sh --runtime all

      - name: Prepare stable Qinglong asset names
        run: |
          set -euo pipefail
          publish_dir="./src/Ray.BiliBiliTool.Console/bin/Publish"
          version="$(cat "$publish_dir/version.txt")"
          for runtime in linux-x64 linux-musl-x64 linux-arm64 linux-arm linux-musl-arm64; do
            source_file="$publish_dir/bilibili-tool-pro-v${version}-${runtime}.zip"
            target_file="$publish_dir/bilibili-tool-pro-fork-main-${runtime}.zip"
            test -f "$source_file"
            cp "$source_file" "$target_file"
          done
          printf '%s\n' "$GITHUB_SHA" > "$publish_dir/fork-main-commit.txt"
          (
            cd "$publish_dir"
            sha256sum bilibili-tool-pro-fork-main-*.zip fork-main-commit.txt > fork-main-sha256.txt
          )

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
        run: |
          set -euo pipefail

          assets=(
            ./src/Ray.BiliBiliTool.Console/bin/Publish/bilibili-tool-pro-fork-main-linux-x64.zip
            ./src/Ray.BiliBiliTool.Console/bin/Publish/bilibili-tool-pro-fork-main-linux-musl-x64.zip
            ./src/Ray.BiliBiliTool.Console/bin/Publish/bilibili-tool-pro-fork-main-linux-arm64.zip
            ./src/Ray.BiliBiliTool.Console/bin/Publish/bilibili-tool-pro-fork-main-linux-arm.zip
            ./src/Ray.BiliBiliTool.Console/bin/Publish/bilibili-tool-pro-fork-main-linux-musl-arm64.zip
            ./src/Ray.BiliBiliTool.Console/bin/Publish/fork-main-commit.txt
            ./src/Ray.BiliBiliTool.Console/bin/Publish/fork-main-sha256.txt
          )

          if gh release view fork-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release 已存在时不删除，直接覆盖资产；同时把 rolling tag 和 Release target 移到当前 main。
            git tag -f fork-main "$GITHUB_SHA"
            git push origin refs/tags/fork-main --force
            gh release upload fork-main "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit fork-main \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Fork main rolling build" \
              --notes "Automated self-contained Qinglong build from commit $GITHUB_SHA" \
              --prerelease
          else
            gh release create fork-main "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Fork main rolling build" \
              --notes "Automated self-contained Qinglong build from commit $GITHUB_SHA" \
              --prerelease
          fi

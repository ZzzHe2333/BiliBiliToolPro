name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete every non-main branch
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#^refs/heads/##' \
            | while IFS= read -r branch; do
                [ -n "$branch" ] || continue
                [ "$branch" = "main" ] && continue
                echo "Deleting branch: $branch"
                git push origin --delete "$branch"
              done

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/cleanup-branches-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/cleanup-branches-once.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:main

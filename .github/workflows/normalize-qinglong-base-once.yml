name: Normalize Qinglong base once

on:
  push:
    branches:
      - fix/post-detach-hardening
    paths:
      - '.github/workflows/normalize-qinglong-base-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/post-detach-hardening
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Remove legacy branch and unsafe mirror defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qinglong/DefaultTasks/bili_task_base.inc')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bili_branch=""                         # 分支名，空或_develop\n', '')
          text = text.replace('QL_BRANCH=${QL_BRANCH:-"develop"}\n', '')
          text = text.replace('use_cn_mirror=${BILI_USE_CN_MIRROR:-"true"} # 本fork主要面向中国大陆，默认使用国内包源',
                              'use_cn_mirror=${BILI_USE_CN_MIRROR:-"false"} # 默认不修改整个青龙容器的软件源')
          text = text.replace('qinglong_bili_repo="$(echo "$bili_repo" | sed \'s/\\//_/g\')${bili_branch}"',
                              'qinglong_bili_repo="$(echo "$bili_repo" | sed \'s/\\//_/g\')"')
          path.write_text(text, encoding='utf-8')
          PY
          bash -n qinglong/DefaultTasks/bili_task_base.inc
          grep -F 'use_cn_mirror=${BILI_USE_CN_MIRROR:-"false"}' qinglong/DefaultTasks/bili_task_base.inc
          ! grep -q 'bili_branch\|QL_BRANCH' qinglong/DefaultTasks/bili_task_base.inc

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/normalize-qinglong-base-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove legacy Qinglong branch defaults'
          git push origin HEAD:fix/post-detach-hardening
